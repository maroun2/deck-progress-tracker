name: Build Plugin Artifact

on:
  push:
    branches:
      - '**'  # Run on all branches

permissions:
  contents: read

jobs:
  build-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history to access tags

      - name: Get version information
        id: version
        run: |
          # Get latest tag (without 'v' prefix)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Get short commit SHA (7 characters)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "Short SHA: $SHORT_SHA"

          # Build version string: {tag}-{sha}
          VERSION="${LATEST_TAG}-${SHORT_SHA}"
          echo "Version: $VERSION"

          # Export for later steps
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Update version in JSON files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating version to: $VERSION"

          # Update package.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          echo "package.json updated"
          grep '"version"' package.json | head -1

          # Update plugin.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" plugin.json
          echo "plugin.json updated"
          grep '"version"' plugin.json | head -1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Check py_modules/vendor matches requirements.txt
        run: |
          # The vendored packages are committed (the Decky store build only
          # copies py_modules/). Reinstall them from requirements.txt and
          # fail if the committed copy differs.
          scripts/vendor-deps.sh "$RUNNER_TEMP/vendor-check"
          diff -r py_modules/vendor "$RUNNER_TEMP/vendor-check" \
            || { echo "::error::py_modules/vendor is out of date - run scripts/vendor-deps.sh and commit"; exit 1; }

      - name: Package plugin (same layout as the Decky store build)
        run: |
          # py_modules/ as-is, including the committed third-party deps in
          # py_modules/vendor (pure-Python wheels, see scripts/vendor-deps.sh)
          scripts/package-plugin.sh plugin-build/deck-progress-tracker "${{ steps.version.outputs.version }}"

      - name: Verify directory contents
        run: |
          echo "=== Plugin directory contents ==="
          ls -lah plugin-build/deck-progress-tracker/
          echo ""
          echo "=== Version in package.json ==="
          grep '"version"' plugin-build/deck-progress-tracker/package.json
          echo ""
          echo "=== Version in plugin.json ==="
          grep '"version"' plugin-build/deck-progress-tracker/plugin.json
          echo ""
          echo "=== VERSION file ==="
          cat plugin-build/deck-progress-tracker/VERSION

      - name: Upload artifact (GitHub will zip it automatically)
        uses: actions/upload-artifact@v4
        with:
          name: deck-progress-tracker-${{ steps.version.outputs.version }}
          path: plugin-build/
          retention-days: 90
