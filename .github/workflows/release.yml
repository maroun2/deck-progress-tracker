name: Build and Release Plugin

on:
  push:
    tags:
      - '*.*.*'  # Triggers on version tags like 1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Create plugin directory structure
        run: |
          mkdir -p plugin-build/deck-progress-tracker/py_modules
          cp -r dist plugin-build/deck-progress-tracker/
          cp py_modules/database.py plugin-build/deck-progress-tracker/py_modules/
          cp py_modules/steam_data.py plugin-build/deck-progress-tracker/py_modules/
          cp py_modules/hltb_service.py plugin-build/deck-progress-tracker/py_modules/
          cp main.py plugin-build/deck-progress-tracker/
          cp plugin.json plugin-build/deck-progress-tracker/
          cp package.json plugin-build/deck-progress-tracker/
          cp requirements.txt plugin-build/deck-progress-tracker/
          cp LICENSE plugin-build/deck-progress-tracker/
          cp README.md plugin-build/deck-progress-tracker/

      - name: Create version file
        run: |
          echo "${{ github.ref_name }}" > plugin-build/deck-progress-tracker/VERSION

      - name: Vendor Python dependencies
        run: |
          # Decky Loader does NOT install requirements.txt for plugins, so
          # bundle backend deps (howlongtobeatpy, aiohttp, etc.) directly in
          # the zip. Decky Loader itself runs on a PyInstaller-frozen
          # Python 3.11 (not the system's python3) with a pruned stdlib -
          # target cp311, and also bundle the stdlib modules known missing
          # from that frozen environment (see py_modules/stdlib_shims).
          python3 -m pip install \
            --target plugin-build/deck-progress-tracker/py_modules/vendor \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --abi cp311 \
            --only-binary=:all: \
            --no-compile \
            -r requirements.txt
          rm -rf plugin-build/deck-progress-tracker/py_modules/vendor/bin
          cp -r py_modules/stdlib_shims/html plugin-build/deck-progress-tracker/py_modules/vendor/

      - name: Create release zip
        run: |
          cd plugin-build
          zip -r ../deck-progress-tracker-${{ github.ref_name }}.zip deck-progress-tracker
          cd ..
          # Also publish under a fixed filename, so GitHub's stable
          # "latest release" alias (releases/latest/download/<filename>)
          # keeps working across versions instead of breaking every time
          # the versioned filename changes.
          cp deck-progress-tracker-${{ github.ref_name }}.zip deck-progress-tracker.zip

      - name: Verify zip contents
        run: |
          unzip -l deck-progress-tracker-${{ github.ref_name }}.zip

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Deck Progress Tracker ${{ github.ref_name }}

          ### Installation

          **Option 1: Install from URL (Recommended)**
          1. Enable Developer Mode in Decky Loader settings
          2. Go to Developer tab → Install Plugin from URL
          3. Enter this URL (always resolves to the latest release):
          ```
          https://github.com/${{ github.repository }}/releases/latest/download/deck-progress-tracker.zip
          ```
          4. Click Install and wait for completion

          **Option 2: Download and Install Manually**
          1. Download `deck-progress-tracker-${{ github.ref_name }}.zip` below
          2. Extract to `~/homebrew/plugins/` on your Steam Deck
          3. Install Python dependencies: `pip install --user -r requirements.txt`
          4. Restart Decky Loader

          ### Features
          - 🎮 Automatic game tagging (Completed, In Progress, Mastered)
          - ⏱️ HowLongToBeat integration for completion times
          - 🎯 Achievement tracking
          - 📊 Library statistics
          - ✏️ Manual tag override
          - ⚙️ Configurable thresholds

          ### First Time Setup
          1. Open plugin settings from Decky menu
          2. Click "Sync Entire Library"
          3. Wait for sync to complete (may take several minutes)
          4. Navigate to game pages to see tags

          ### Requirements
          - Steam Deck with Decky Loader installed
          - Internet connection (for HLTB data)

          ### Support
          Report issues at: https://github.com/${{ github.repository }}/issues
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            deck-progress-tracker-${{ github.ref_name }}.zip
            deck-progress-tracker.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
